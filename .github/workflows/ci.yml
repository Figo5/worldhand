name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check (app + tests)
        run: npm run typecheck
      - name: Tests (incl. Classic replay fixtures)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Portable build
        run: npm run build:portable
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Portable browser QA
        run: node scripts/qa-portable.mjs
      - name: Ascension stays dev-only
        run: node scripts/qa-ascension-dev.mjs
